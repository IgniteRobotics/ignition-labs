name: Check Documentation Links

on:
  pull_request:
    paths: ['**.md', 'templates/**', 'docs/**']
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Templates match their source regions
        # tools/templates_sync.py is stdlib-only (re, sys, pathlib) -- this job has no
        # Poetry setup, so plain python3 is correct here, same as given_tests_red.py in
        # skeleton-integrity.yml.
        #
        # Runs before the lychee step on purpose: lychee has `fail: true`, and a flaky
        # external URL (rate limit, transient outage) must not cause this guard to be
        # skipped.
        run: python3 tools/templates_sync.py verify

      - name: Check links
        # Robot-2026 is private. lychee fetches unauthenticated, so every link into it
        # is a 404 that says nothing about whether the link is good. ignition-labs was
        # excluded too while it was private; it is public again (spec §16.1), so its
        # links are checked.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude '^https://github\.com/IgniteRobotics/Robot-2026([/#?.]|$)'
            --exclude-path superpowers
            --exclude-path .superpowers
            './**/*.md'
          fail: true
