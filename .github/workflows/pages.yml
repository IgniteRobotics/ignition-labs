name: Publish Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/site_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install pinned docs dependencies
        run: poetry install --only docs

      - name: Build site
        # --strict per teaching-repo-spec.md §16 item 7. It was deliberately off while
        # robot-repo-ladder.md linked UNTESTED-TARGETS.md before that file existed;
        # the file shipped at build-order step 8, so the warning is gone and the gate
        # can be real. Without it a broken internal link is a silent 404 that neither
        # lychee nor tools/site_guard.py can catch -- they check different failure modes.
        run: poetry run mkdocs build --strict

      - name: Guard against published source files
        run: python tools/site_guard.py ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
