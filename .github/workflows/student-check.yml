name: Student Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.derive.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Derive changed projects
        id: derive
        run: |
          # actions/checkout above already ran with fetch-depth: 0, which
          # fetches full history and all branches. A further shallow
          # `git fetch --depth=1` here writes .git/shallow and makes the
          # diff below die with "no merge base" whenever the merge ref is
          # stale. Do not re-add it.
          # core.quotePath=false: the default (true) C-quotes non-ASCII paths
          # in octal escapes, which makes tools/changed_projects.py silently
          # drop that file from the matrix — a changed project never gets
          # built and CI goes green on unbuilt code.
          git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          echo "Changed files:"; cat changed.txt
          echo "projects=$(python tools/changed_projects.py --from-file changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify given tests are unmodified
        run: python tools/tests_lock.py verify

      - name: Validate contributor files
        run: python tools/contributors_check.py

  build:
    needs: matrix
    if: needs.matrix.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: ${{ matrix.project }}
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ${{ matrix.project }}
        run: ./gradlew build --console=plain

      - name: Check code formatting
        id: spotless
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: |
          set -o pipefail
          if ./gradlew spotlessCheck --console=plain 2>&1 | tee spotless-output.txt; then
            echo "formatted=true" >> "$GITHUB_OUTPUT"
          else
            echo "formatted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on formatting violations
        if: steps.spotless.outputs.formatted == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Formatting check failed in `${{ matrix.project }}`',
                '',
                'Run this and commit the result:',
                '',
                '```bash',
                'cd ${{ matrix.project }} && ./gradlew spotlessApply',
                '```',
                '',
                'This is not a judgement of your code. The formatter is automatic ' +
                'so nobody has to argue about braces in review.'
              ].join('\n')
            })

      - name: Fail loudly on formatting violations
        # The PR comment above is a convenience for same-repo PRs. For
        # cross-fork PRs, GitHub issues a read-only GITHUB_TOKEN that the
        # comment step cannot post with — a 403 there must never be the
        # only signal a student gets. This step is the guaranteed signal:
        # it always shows up as a red job with the same guidance in the log.
        if: steps.spotless.outputs.formatted == 'false'
        working-directory: ${{ matrix.project }}
        run: |
          echo "::error::Formatting check failed in ${{ matrix.project }}"
          echo "Run this and commit the result:"
          echo ""
          echo "    cd ${{ matrix.project }} && ./gradlew spotlessApply"
          echo ""
          echo "This is not a judgement of your code. The formatter is automatic"
          echo "so nobody has to argue about braces in review."
          exit 1
