name: Skeleton Integrity

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'tests.lock'
      - '.github/workflows/skeleton-integrity.yml'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths: ['projects/**', 'tests.lock']

permissions:
  contents: read

jobs:
  matrix:
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - name: List every skeleton project
        id: list
        run: |
          # find's exit status is swallowed by the pipe into sort | jq, so a
          # missing projects/ directory would otherwise still yield a clean
          # `[]` via the empty split — that is the intended graceful skip.
          # Guard it explicitly rather than relying on that implicit
          # behaviour, which breaks the moment anyone adds `set -o pipefail`.
          test -d projects || { echo "projects=[]" >> "$GITHUB_OUTPUT"; exit 0; }
          found=$(find projects -mindepth 2 -maxdepth 3 -name settings.gradle -printf '%h\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "projects=$found" >> "$GITHUB_OUTPUT"
          echo "Found: $found"

  integrity:
    needs: matrix
    if: github.repository == 'IgniteRobotics/ignition-labs' && needs.matrix.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - working-directory: ${{ matrix.project }}
        run: chmod +x gradlew

      # This must run before "Skeleton compiles on a clean clone". A build step
      # must never be trusted to leave the tree as it found it -- that is
      # exactly how compileJava.dependsOn 'spotlessApply' made this gate
      # unreachable before (it silently reformatted the tree on every compile,
      # so spotlessCheck never saw a violation). Checking formatting first
      # means a future build step that reformats the tree again cannot disable
      # this gate without the reorder itself being the thing that has to change.
      - name: Skeleton is already formatted
        working-directory: ${{ matrix.project }}
        run: |
          # FormatMe.java is the M0 formatting exercise (spec §9.1): the one
          # deliberately mis-formatted artifact in the whole curriculum. M1-M9
          # ship stubs that throw UnsupportedOperationException, and those are
          # properly formatted -- FormatMe.java is the sole, intentional
          # exception, fixed locally with spotlessApply and never committed.
          # It is exempted here by filename convention rather than listed in
          # build.gradle so the exemption is self-maintaining, the same way
          # the inverted check below skips on the absence of src/test rather
          # than an exemption list.
          #
          # Do not just ignore spotlessCheck's exit code to grant that
          # exemption -- that would silently pass this step even when some
          # OTHER file is unformatted, which is the exact "check that passes
          # while the thing it protects is broken" failure this repo keeps
          # producing. Instead, capture the command's own exit status via
          # command substitution (never pipe it into something like `tee`,
          # which would mask it) and inspect spotlessCheck's own violation
          # report: only pass when every offending file it names is a
          # FormatMe.java, and fail loudly -- rather than pass by default --
          # if the report can't be parsed at all, since that means something
          # other than a clean formatting violation happened.
          set +e
          output=$(./gradlew spotlessCheck --console=plain 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          offenders=$(echo "$output" | sed -n '/had format violations:/,/^Run .\.\/gradlew spotlessApply. to fix/p' \
            | grep -E '^ {6}\S' | sed 's/^ *//')
          non_exempt=$(echo "$offenders" | grep -v '/FormatMe\.java$' | grep -vx 'FormatMe\.java' || true)
          if [ -n "$non_exempt" ]; then
            echo "::error::spotlessCheck failed on non-exempt file(s):"
            echo "$non_exempt"
            exit "$status"
          fi
          if [ -z "$offenders" ]; then
            echo "::error::spotlessCheck failed but no violating files were parsed from its output; treating as a real failure rather than swallowing it."
            exit "$status"
          fi
          echo "OK: only FormatMe.java (the formatting exercise, spec §9.1) is mis-formatted."

      - name: Skeleton compiles on a clean clone
        working-directory: ${{ matrix.project }}
        run: ./gradlew assemble --console=plain

      - name: Given tests compile on a clean clone
        working-directory: ${{ matrix.project }}
        run: |
          # assemble does NOT compile src/test, so without this step a test compile
          # error arrives at the inverted check below as nothing more than a non-zero
          # `test` exit -- which that check used to read as "red as intended". Spec
          # §12.3 requires compileTestJava green in its own right, and a student who
          # cannot tell a compile error from a broken toolchain loses a session that
          # was never their problem.
          if [ ! -d src/test ]; then
            echo "No src/test in ${{ matrix.project }} — nothing to compile. Skipping."
            exit 0
          fi
          ./gradlew compileTestJava --console=plain

      - name: Inverted check — given tests MUST fail, and for the right reason
        working-directory: ${{ matrix.project }}
        run: |
          # Three branches, all keyed on what the project CONTAINS rather than on a list of
          # project names. An exemption list is the smaller diff and is deliberately not
          # what this is: a name-keyed skip is the exact shape of "a check that passes while
          # the thing it protects is broken," which this repository keeps producing.
          #
          #   regressions/ present  -> M6: the suite is green, and must go provably red
          #                            under a planted patch. Spec §12.3's guarantee is that
          #                            a skeleton is never SILENTLY SATISFIABLE; for M1-M5
          #                            that means the given tests fail, for M6 it means the
          #                            given tests catch a regression.
          #   no src/test           -> M0: no given tests, nothing to invert.
          #   otherwise             -> M1-M5: the given tests must be red, for a real reason.
          if [ -d regressions ]; then
            echo "$(basename "$PWD") ships regressions/ — running the regression gate."
            cd "$GITHUB_WORKSPACE"
            # Example tier: the ONE given test must catch this, which is the only way this
            # repository can prove the mechanism works at all -- there are no student tests
            # here to catch anything.
            python3 -m tools.regression_gate "${{ matrix.project }}" \
              "${{ matrix.project }}/regressions/drop-gear-ratio.patch" \
              --expect "caught:frc.robot.WorkedExampleTest#ticksToMechanismRotations_appliesBothTicksPerRevolutionAndGearRatio"
            # Student tier: the given test must NOT catch these. If it does, a student
            # passes the gate in their own fork having written no tests at all -- and
            # nothing else in this pipeline would ever say so.
            for patch in "${{ matrix.project }}"/regressions/*.patch; do
              case "$(basename "$patch")" in
                drop-gear-ratio.patch) continue ;;
              esac
              python3 -m tools.regression_gate "${{ matrix.project }}" "$patch" \
                --expect no-failure
            done
            exit 0
          fi

          # A skeleton with no src/test has no given tests, so there is nothing to invert --
          # M0 is a complete working project by design (spec §9.1, fade N/A).
          if [ ! -d src/test ]; then
            echo "No src/test in ${{ matrix.project }} — no given tests to invert. Skipping."
            exit 0
          fi
          # A non-zero exit status alone is NOT evidence of a correctly red skeleton:
          # an UnsatisfiedLinkError exits non-zero too, and so does a build that never
          # ran a test at all. M0-M2 were plain Java and could not link-fail, so the
          # distinction did not exist until M3 started needing desktop HAL natives.
          # tools/given_tests_red.py inspects the JUnit reports and fails loudly on
          # anything it cannot positively confirm as legitimate red. It is stdlib-only,
          # so the runner's preinstalled python3 is enough -- no setup-python needed.
          # Not named `status`: that is read-only in zsh, which silently breaks anyone
          # reproducing this step by hand on a Mac.
          set +e
          ./gradlew test --console=plain
          test_status=$?
          set -e
          python3 "$GITHUB_WORKSPACE/tools/given_tests_red.py" . "$test_status"

  lock:
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tests.lock matches the tree
        run: |
          # This regenerates the manifest and FAILS if it differs from the
          # committed tests.lock. Deliberately no commit/push of the result:
          # doing so would silently absorb a student's tampering into the new
          # baseline, defeating the entire mechanism. Do not "helpfully" add
          # an auto-commit step here.
          python tools/tests_lock.py write
          git diff --exit-code tests.lock \
            || { echo "::error::tests.lock is stale. Run: python tools/tests_lock.py write"; exit 1; }

  pytest:
    if: github.repository == 'IgniteRobotics/ignition-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run test suite
        run: poetry run pytest
